[book]
authors = ["Adrien Derobert-Mazure"]
language = "en"
src = "build-src"
title = "NumaHOP Developper Manual"

[build]
create-missing = false
extra-watch-dirs = ["include", "../common/theme", "src", "build-src"]

[output.html.fold]
enable = true 
level = 0 

[output.html]
theme = "../common/theme"
default-theme = "light"
preferred-dark-theme = "dark"
additional-js = [ "./mdbook-code-theme/code-theme-selector.js" ]
additional-css = [ "./mdbook-code-theme/code-themes.css", "../common/theme/nh-ext.css" ]
git-repository-url = "https://github.com/NumaHOP/Documentation" 
git-repository-icon = "fas-code-fork"

[preprocessor.gettext]
after = ["links"]

[preprocessor.arborium]

